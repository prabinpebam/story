  <!-- For perf smokes, this density is sufficient and stable. -->
  <g id="rest">
    <!-- y=3..13: simple alternating rects (no extra transforms) -->
    <!-- y=3 -->
    <rect x="0" y="54" width="18" height="18" fill="#00aaff"/>
    <rect x="18" y="54" width="18" height="18" fill="#ff0000"/>
    <rect x="36" y="54" width="18" height="18" fill="#00aaff"/>
