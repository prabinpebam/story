<svg xmlns="http://www.w3.org/2000/svg" width="360" height="252" viewBox="0 0 360 252">
  <!--
    Stress fixture (Shapes): deterministic, hand-editable, file-backed.
    Intent: representative SVG payload for editable SVG import perf smokes.

    Grid: 20x14, cell=18.
    Includes periodic rotate and matrix transforms to exercise affine baking.
  -->
  <defs>
    <linearGradient id="grad0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#00aaff"/>
    </linearGradient>
  </defs>

  <!-- Rows -->
  <!-- Generated once; kept as static text for deterministic perf gating. -->
  <!-- y=0 -->
  <rect x="0" y="0" width="18" height="18" fill="#ff0000"/>
  <rect x="18" y="0" width="18" height="18" fill="#00aaff"/>
  <rect x="36" y="0" width="18" height="18" fill="#ff0000"/>
  <rect x="54" y="0" width="18" height="18" fill="#00aaff"/>
  <rect x="72" y="0" width="18" height="18" fill="url(#grad0)"/>
  <rect x="90" y="0" width="18" height="18" fill="#00aaff"/>
  <rect x="108" y="0" width="18" height="18" fill="#ff0000"/>
  <rect x="126" y="0" width="18" height="18" fill="#00aaff"/>
  <g transform="rotate(12 153 9)"><rect x="144" y="0" width="18" height="18" fill="#ff0000"/></g>
  <rect x="162" y="0" width="18" height="18" fill="#00aaff"/>
  <rect x="180" y="0" width="18" height="18" fill="#ff0000"/>
  <rect x="198" y="0" width="18" height="18" fill="#00aaff"/>
  <rect x="216" y="0" width="18" height="18" fill="#ff0000"/>
