    <g transform="translate(0 72)">
      <rect x="0" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="18" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="36" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="54" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="72" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="90" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="108" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="126" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="144" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="162" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="180" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="198" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="216" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="234" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="252" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="270" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="288" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="306" y="0" width="18" height="18" fill="#00aaff"/>
      <rect x="324" y="0" width="18" height="18" fill="#ff0000"/>
      <rect x="342" y="0" width="18" height="18" fill="#00aaff"/>

