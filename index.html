    <style>
        /* Critical Boot Styles - Phase 1: Immediate Boot */
        .boot-screen {
            position: fixed;
            inset: 0;
            background-color: #1E1E1E; /* Matches --color-bg-app default */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        
        .boot-logo {
            width: 64px;
            height: 64px;
            animation: boot-pulse 2s infinite ease-in-out;
        }

        .boot-error {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: #E8E8E8; /* Matches --color-text-primary */
            font-family: 'Inter', sans-serif;
            text-align: center;
        }

        .boot-retry-btn {
            background-color: #18A0FB; /* Matches --color-accent */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-family: inherit;
        }

        .boot-retry-btn:hover {
            background-color: #3DB8FF;
        }

        @keyframes boot-pulse {
            0% { opacity: 0.6; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.6; transform: scale(0.95); }
        }

        /* Phase 3: Shimmer Critical CSS */
        story-shimmer {
            display: block;
            background-color: var(--color-bg-panel, #2D2D2D);
            border-radius: 4px;
        }
        
        .skeleton-group {
            padding: 16px;
            opacity: 1;
            transition: opacity 0.3s ease-out;
        }
        
        .skeleton-group.hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute; /* Remove from flow */
        }
    </style>
    <!-- Phase 2: Theme Hydration (Blocking) -->
    <script src="src/boot/theme-hydration.js"></script>
</head>
<body>

        <div id="boot-error" class="boot-error">
            <p>Something went wrong loading Story.</p>
            <button class="boot-retry-btn" onclick="window.location.reload()">Retry</button>
        </div>

    <script>
        // Resilience: Timeout fallback
        (function() {
            const BOOT_TIMEOUT = 10000; // 10 seconds
            const bootScreen = document.getElementById('boot-screen');
            const bootLogo = bootScreen.querySelector('.boot-logo');
            const bootError = document.getElementById('boot-error');
            
            const timeoutId = setTimeout(() => {
                if (bootScreen && bootScreen.isConnected) {
                    bootLogo.style.display = 'none';
                    bootError.style.display = 'flex';
                    console.error('App load timeout');
                }
            }, BOOT_TIMEOUT);

            window.clearBootTimeout = () => {
                clearTimeout(timeoutId);
            };

            // Called by the app when it's ready
            window.appReady = () => {
                clearTimeout(timeoutId);
                if (bootScreen) {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => {
                        if (bootScreen.isConnected) {
                            bootScreen.remove();
                        }
                    }, 300); // Match transition duration
                }
            };
        })();
    </script>
    <div id="app">
        <!-- Left Sidebar: Navigation & Layers -->
        <aside id="sidebar-left" class="sidebar">
            <div id="app-menu-container" class="sidebar-header">
                <!-- AppMenu will be mounted here by JavaScript -->
            </div>
            <div class="sidebar-content">
                <!-- Slide Thumbnails will go here -->
                <div id="slide-list" class="panel-section" data-testid="slide-list">
                    <div class="section-title">SLIDES</div>
                    <!-- Phase 3: Skeleton -->
                    <div id="skeleton-slides" class="skeleton-group">
                        <story-shimmer width="100%" height="100px" radius="8px" style="margin-bottom: 12px"></story-shimmer>
                        <story-shimmer width="100%" height="100px" radius="8px" style="margin-bottom: 12px"></story-shimmer>
                        <story-shimmer width="100%" height="100px" radius="8px" style="margin-bottom: 12px"></story-shimmer>
                    </div>
                </div>
                
                <div id="layer-tree" class="panel-section" data-testid="layer-tree">
                    <div class="section-title">LAYERS</div>
                    <!-- Phase 3: Skeleton -->
                    <div id="skeleton-layers" class="skeleton-group">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0;">
                            <story-shimmer width="12px" height="12px" radius="2px"></story-shimmer>
                            <story-shimmer width="60%" height="12px"></story-shimmer>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0;">
                            <story-shimmer width="12px" height="12px" radius="2px"></story-shimmer>
                            <story-shimmer width="40%" height="12px"></story-shimmer>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0;">
                            <story-shimmer width="12px" height="12px" radius="2px"></story-shimmer>
                            <story-shimmer width="70%" height="12px"></story-shimmer>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center: Main Canvas -->
        <main id="main-stage">
            <div id="stage-command-bar">
                <button type="button" id="compact-navigator-trigger" class="compact-rail-trigger" aria-label="Open navigator" aria-controls="sidebar-left" aria-expanded="false" data-testid="compact-navigator-trigger">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <nav id="authoring-view-switcher" class="authoring-view-switcher" aria-label="Workspace views" role="tablist" data-testid="authoring-view-switcher">
                    <button type="button" class="authoring-view-tab active" data-authoring-view="Canvas" role="tab" aria-selected="true" aria-controls="canvas-viewport" data-testid="view-canvas">
                        <i class="fa-solid fa-pen-ruler" aria-hidden="true"></i><span>Canvas</span>
                    </button>
                    <button type="button" class="authoring-view-tab" data-authoring-view="Grid" role="tab" aria-selected="false" aria-controls="authoring-workspace" data-testid="view-grid">
                        <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i><span>Grid</span>
                    </button>
                    <button type="button" class="authoring-view-tab" data-authoring-view="Outline" role="tab" aria-selected="false" aria-controls="authoring-workspace" data-testid="view-outline">
                        <i class="fa-solid fa-list" aria-hidden="true"></i><span>Outline</span>
                    </button>
                    <button type="button" class="authoring-view-tab" data-authoring-view="Notes" role="tab" aria-selected="false" aria-controls="authoring-workspace" data-testid="view-notes">
                        <i class="fa-solid fa-note-sticky" aria-hidden="true"></i><span>Notes</span>
                    </button>
                    <button type="button" class="authoring-view-tab" data-authoring-view="System" role="tab" aria-selected="false" aria-controls="authoring-workspace" data-testid="view-system">
                        <i class="fa-solid fa-sitemap" aria-hidden="true"></i><span>System</span>
                    </button>
                </nav>
                <button type="button" id="compact-inspector-trigger" class="compact-rail-trigger" aria-label="Open inspector" aria-controls="sidebar-right" aria-expanded="false" data-testid="compact-inspector-trigger">
                    <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                </button>

                <div id="top-controls">
                    <button class="action-btn" id="edit-master-btn" data-testid="edit-master-btn">
                        <i class="fa-solid fa-layer-group"></i> Edit Master
                    </button>
                    <button class="action-btn hidden" id="close-master-btn" data-testid="close-master-btn">
                        <i class="fa-solid fa-xmark"></i> Close Master
                    </button>
                    <button class="action-btn" id="play-btn" data-testid="play-btn">
                        <i class="fa-solid fa-play"></i> PLAY
                    </button>
                    <div id="profile-button-container"></div>
                </div>
            </div>

            <nav id="cue-line" class="cue-line" aria-label="Current source and readiness" data-testid="cue-line"></nav>

            <!-- Floating Toolbar (Bottom Center) -->
            <div id="floating-toolbar">
                <button class="tool-btn active" data-tool="select" title="Move (V)" aria-label="Select tool" data-testid="tool-select">
                    <i class="fa-solid fa-arrow-pointer"></i>
                </button>
                <button class="tool-btn" data-tool="hand" title="Hand Tool (H)" aria-label="Hand tool" data-testid="tool-hand">
                    <i class="fa-solid fa-hand"></i>
                </button>
                <div class="divider"></div>
                    <button class="tool-btn btn-split" data-tool="shape" title="Rectangle (R)" aria-label="Shape tool" data-testid="tool-shape">
                        <span class="btn-split__main">
                            <i class="fa-regular fa-square" data-testid="tool-shape-icon"></i>
                        </span>
                        <span class="btn-split__caret" data-testid="tool-shape-caret" aria-hidden="true">
                            <i class="fa-solid fa-chevron-down"></i>
                        </span>
                    </button>
                <button class="tool-btn" data-tool="text" title="Text (T)" aria-label="Text tool" data-testid="tool-text">
                    <i class="fa-solid fa-font"></i>
                </button>
                <button class="tool-btn" data-tool="image" title="Image (Shift+K)" aria-label="Image tool" data-testid="tool-image">
                    <i class="fa-regular fa-image"></i>
                </button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="resources" title="Resources (Shift+I)" aria-label="Resources" data-testid="tool-resources">
                    <i class="fa-solid fa-shapes"></i>
                </button>
            </div>

            <!-- Floating Panels Container -->
            <div id="floating-panels">
                <div id="icon-library" class="floating-panel hidden">
                    <div class="panel-header">
                        <span>Icons</span>
                        <button class="close-btn" aria-label="Close" data-testid="icon-library-close-btn"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div id="icon-library-content" class="panel-content">
                        <!-- Dynamic Content -->
                    </div>
                </div>
            </div>
            
            <!-- Presentation Grid View -->
            <div id="presentation-grid-view" class="hidden">
                <div class="grid-header">
                    <h2>Slide Navigator</h2>
                    <button id="close-grid-btn" class="icon-btn" data-testid="close-grid-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="grid-content" class="grid-content">
                    <!-- Thumbnails injected here -->
                </div>
            </div>

            <!-- Presentation HUD -->
            <div id="presentation-hud" class="hidden"></div>

            <section id="authoring-workspace" class="authoring-workspace hidden" role="tabpanel" aria-live="polite" data-testid="authoring-workspace"></section>

            <div id="canvas-viewport">
                <!-- File Indicator Pill -->
                <div id="file-indicator-container"></div>
                <div id="canvas-container">
                    <!-- Viewport Wrapper for Pan/Zoom -->
                    <div id="viewport">
                        <!-- 1. Background Layer -->
                        <div id="slide-background"></div>

                        <!-- 2. Content Layer (The Slide) -->
                        <div id="slide-content">
                            <!-- Elements will be injected here -->
                        </div>

                        <!-- 3. Interaction Layer (Canvas) -->
                        <canvas id="interaction-canvas"></canvas>
                    </div>
                </div>
                
                <!-- Presentation Overlays (Moved out of viewport to avoid transform clipping) -->
                <canvas id="laser-canvas"></canvas>
                <div id="overlay-black" class="presentation-overlay hidden" style="background-color: black;"></div>
                <div id="overlay-white" class="presentation-overlay hidden" style="background-color: white;"></div>

                <!-- Viewport Controls -->
                <div id="viewport-controls">
                    <button id="btn-fit" class="icon-btn" title="Fit to View" data-testid="btn-fit"><i class="fa-solid fa-compress"></i></button>
                    <button id="btn-layout-guides" class="icon-btn" title="Toggle Layout Guides" data-testid="btn-layout-guides"><i class="fa-solid fa-border-all"></i></button>
                    <button id="btn-snapping-options" class="icon-btn" title="Snapping Options" data-testid="btn-snapping-options"><i class="fa-solid fa-magnet"></i></button>
                    <div class="zoom-group">
                        <button id="btn-zoom-out" class="icon-btn" data-testid="btn-zoom-out"><i class="fa-solid fa-minus"></i></button>
                        <span id="zoom-display">100%</span>
                        <button id="btn-zoom-in" class="icon-btn" data-testid="btn-zoom-in"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar: Properties -->
        <aside id="sidebar-right" class="sidebar">
            <div class="sidebar-header">
                <span class="header-title">Properties</span>
            </div>
            <div class="sidebar-content">
                <!-- Context aware properties -->
                <div id="properties-panel">
                    <!-- Phase 3: Skeleton -->
                    <div id="skeleton-props" class="skeleton-group">
                        <story-shimmer width="40%" height="14px" style="margin-bottom: 16px"></story-shimmer>
                        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                            <story-shimmer width="50%" height="32px" radius="4px"></story-shimmer>
                            <story-shimmer width="50%" height="32px" radius="4px"></story-shimmer>
                        </div>
                        <story-shimmer width="100%" height="32px" radius="4px" style="margin-bottom: 12px"></story-shimmer>
                        <story-shimmer width="100%" height="1px" style="margin: 16px 0"></story-shimmer>
                        <story-shimmer width="60%" height="14px" style="margin-bottom: 16px"></story-shimmer>
                        <story-shimmer width="100%" height="80px" radius="4px"></story-shimmer>
                    </div>
                    <div class="empty-state hidden">No selection</div>
                </div>
            </div>
        </aside>
        <button type="button" id="compact-rail-backdrop" class="compact-rail-backdrop hidden" aria-label="Close side panel" data-testid="compact-rail-backdrop"></button>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
